name: services-ci

on:
  workflow_call:
    inputs:
      enforce_coverage:
        required: false
        type: boolean
        default: false

jobs:
  services-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint Services
        run: pnpm run lint:services

      - name: Test Services
        run: pnpm run ${{ inputs.enforce_coverage && 'test:coverage:services' || 'test:services' }}
        env:
          REPOSITORY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: pnpm run build
